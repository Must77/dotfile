set -g mouse on
set -g mode-keys vi

# fix: ESC key delayed/swallowed by tmux, so opencode TUI interrupt doesn't work
set -g escape-time 50

set -g prefix C-a
bind C-a send-prefix

# improve colors; use tmux-256color if available, otherwise install ncurses-term
set -g default-terminal 'tmux-256color'
set -as terminal-overrides ',xterm-256color:RGB'

# simplify status-right
set -g status-right '%H:%M %d-%b-%y'
set -g status-right-length 20

# let app know focus-event
set -g focus-events on

# kimi-code required
set -g extended-keys on
# tmux 3.4 removed extended-keys-format (encoding is auto-negotiated); safe to omit on all versions

# notify me when codex finish
set -gw monitor-bell on
set -g bell-action other
set -g visual-bell on
set -g display-time 5000
set-hook -g alert-bell 'display-message "#[align=centre]Codex 在窗口 #{window_index} 中有活动"'
